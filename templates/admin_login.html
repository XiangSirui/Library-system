<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 阅享空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-login-page">
  <div class="login-card">
    <a href="/" class="login-back">← 返回首页</a>
    <div class="login-brand">
      <span class="login-icon">📚</span>
      <h1>阅享空间</h1>
      <p>管理员登录</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <p class="login-hint">默认账号 admin / admin123（首次部署后请修改）</p>
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="/static/js/admin-login.js"></script>
</body>
</html>
